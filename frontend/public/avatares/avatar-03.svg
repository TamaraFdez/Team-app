<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="titulo">
  <title id="titulo">Villano</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d33"/>
      <stop offset="0.5" stop-color="#1b3a9e"/>
      <stop offset="1" stop-color="#3a1670"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9fbff"/>
      <stop offset="0.6" stop-color="#5fe0ff"/>
      <stop offset="1" stop-color="#2a9fd8"/>
    </radialGradient>
    <filter id="borde" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="brillo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="niebla"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="figura">
      <!-- Cuernos en forma de media luna -->
      <path d="M102 72 C86 56 86 30 102 14 C98 34 104 50 120 60 Z"/>
      <path d="M154 72 C170 56 170 30 154 14 C158 34 152 50 136 60 Z"/>
      <path d="M128 50 C148 50 158 64 158 84 C158 104 150 122 138 132 L128 140 L118 132 C106 122 98 104 98 84 C98 64 108 50 128 50 Z"/>
      <!-- Cuello alto de la capa -->
      <path d="M64 178 L74 112 L102 150 L110 128 L128 150 L146 128 L154 150 L182 112 L192 178 Z"/>
      <path d="M128 140 C100 150 70 156 48 168 C26 180 16 210 8 256 L248 256 C240 210 230 180 208 168 C186 156 156 150 128 140 Z"/>
    </g>
  </defs>

  <rect width="256" height="256" fill="url(#cielo)"/>
  <circle cx="128" cy="104" r="70" fill="url(#luna)"/>
  <g fill="#2a9fd8" opacity="0.25">
    <circle cx="100" cy="80" r="9"/>
    <circle cx="160" cy="126" r="12"/>
    <circle cx="150" cy="70" r="5"/>
  </g>
  <path d="M0 256 V180 H10 V150 L16 128 L22 150 V170 H32 V140 L40 108 L48 140 V256 Z M256 256 V176 H246 V146 L240 120 L234 146 V160 H222 V132 L214 98 L206 132 V256 Z" fill="#24206e" opacity="0.9"/>
  <g fill="#7a2cff" opacity="0.45" filter="url(#niebla)">
    <ellipse cx="30" cy="240" rx="60" ry="20"/>
    <ellipse cx="230" cy="236" rx="60" ry="22"/>
  </g>

  <use href="#figura" fill="#7ff0ff" transform="translate(-2.5 -1.5)" filter="url(#borde)"/>
  <use href="#figura" fill="#7ff0ff" transform="translate(2.5 -1.5)" filter="url(#borde)"/>
  <use href="#figura" fill="#120a2e"/>

  <path d="M92 196 L78 256 M164 196 L178 256 M128 172 L128 256" stroke="#221a5a" stroke-width="2" fill="none"/>
  <circle cx="128" cy="160" r="6" fill="#b46bff" filter="url(#brillo)"/>
  <g fill="#d48bff" filter="url(#brillo)">
    <path d="M108 92 L124 98 L122 102 L110 99 Z"/>
    <path d="M148 92 L132 98 L134 102 L146 99 Z"/>
  </g>
</svg>
