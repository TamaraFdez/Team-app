  <!-- Llama mágica -->
  <path d="M214 236 C198 226 200 206 212 194 C210 206 218 208 220 200 C224 190 220 180 214 170 C232 180 240 200 236 216 C233 229 225 236 214 236 Z" fill="#b04bff" filter="url(#brillo)"/>
  <path d="M216 230 C208 224 208 214 214 206 C214 212 220 214 222 208 C228 216 226 228 216 230 Z" fill="#f0c4ff"/>
</svg>
