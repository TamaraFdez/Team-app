      <stop offset="0.65" stop-color="#ff7a2a"/>
      <stop offset="1" stop-color="#e0461a"/>
    </radialGradient>
    <filter id="borde" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="brillo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="niebla"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="figura">
