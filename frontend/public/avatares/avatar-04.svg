      <path d="M110 60 L114 34 L120 56 Z"/>
      <path d="M122 54 L128 20 L134 54 Z"/>
      <path d="M136 56 L142 34 L146 60 Z"/>
      <!-- Melena con mechones -->
      <path d="M128 46 C100 46 86 64 88 92 C90 118 80 140 62 160 C74 162 84 158 92 150 C86 164 78 172 66 178 C86 180 100 168 106 150 L108 110 L148 110 L150 150 C156 168 170 180 190 178 C178 172 170 164 164 150 C172 158 182 162 194 160 C176 140 166 118 168 92 C170 64 156 46 128 46 Z"/>
      <path d="M128 58 C145 58 153 72 152 90 C151 106 145 118 137 126 L128 134 L119 126 C111 118 105 106 104 90 C103 72 111 58 128 58 Z"/>
      <path d="M112 118 L144 118 L150 162 L106 162 Z"/>
      <!-- Cuello alto -->
      <path d="M70 184 L84 128 L106 160 L128 146 L150 160 L172 128 L186 184 Z"/>
      <path d="M128 136 C106 148 82 156 64 166 C44 178 36 204 30 256 L226 256 C220 204 212 178 192 166 C174 156 150 148 128 136 Z"/>
