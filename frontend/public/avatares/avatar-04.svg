  <rect width="256" height="256" fill="url(#cielo)"/>
  <circle cx="128" cy="106" r="72" fill="url(#luna)"/>
  <path d="M0 256 V170 H12 V140 L20 112 L28 140 V160 H40 V256 Z M256 256 V166 H244 V136 L236 104 L228 136 V256 Z" fill="#3a1050" opacity="0.9"/>
  <g fill="#b04bff" opacity="0.45" filter="url(#niebla)">
    <ellipse cx="24" cy="230" rx="50" ry="26"/>
    <ellipse cx="236" cy="200" rx="40" ry="40"/>
  </g>

  <use href="#figura" fill="#ffa04d" transform="translate(-2.5 -1.5)" filter="url(#borde)"/>
  <use href="#figura" fill="#ffa04d" transform="translate(2.5 -1.5)" filter="url(#borde)"/>
  <use href="#figura" fill="#120a2e"/>

  <path d="M128 160 L128 256 M100 200 L92 256 M156 200 L164 256" stroke="#2a1450" stroke-width="2" fill="none"/>
  <g fill="#ff6bf0" filter="url(#brillo)">
    <path d="M111 92 L124 96 L121 100 L113 97 Z"/>
    <path d="M145 92 L132 96 L135 100 L143 97 Z"/>
